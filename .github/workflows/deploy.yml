name: Deploy

# Ships main to one deployment of the fleet (deployments/<id>.jsonc). CI calls this once per
# deployment, ring by ring; see docs/operations.md.
on:
  workflow_call:
    inputs:
      deployment:
        description: One deployment from `node scripts/fleet.ts matrix`, as JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ fromJSON(inputs.deployment).id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The deployment's GitHub environment holds its secrets (APP_PASSWORD, SHOPIFY_WEBHOOK_SECRET,
    # INTAKE_ALLOWLIST) and, if it should, a required reviewer.
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID can be repository secrets.
    environment:
      name: ${{ fromJSON(inputs.deployment).environment }}
      url: https://${{ fromJSON(inputs.deployment).domain }}
    concurrency:
      group: deploy-${{ fromJSON(inputs.deployment).id }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ID: ${{ fromJSON(inputs.deployment).id }}
      DOMAIN: ${{ fromJSON(inputs.deployment).domain }}
      # Rendered next to each app's wrangler.jsonc by the Render step.
      CONFIG: wrangler.${{ fromJSON(inputs.deployment).id }}.json
    # The Cloudflare API sometimes fails a request outright (codes 7403, 10013) and succeeds on
    # the next try. Each step below is idempotent, so `retry` runs it up to three times; without
    # it a blip between the engine and web steps leaves the deployment running mismatched Workers.
    defaults:
      run:
        shell: bash
    steps:
      # A merge that silently skips its deploy looks like a deploy: fail instead.
      - name: Check deploy credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set to deploy"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install retry helper
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/retry" <<'SH'
          #!/usr/bin/env bash
          for attempt in 1 2 3; do
            "$@" && exit 0
            echo "::warning::attempt $attempt failed: $*"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          exit 1
          SH
          chmod +x "$HOME/.local/bin/retry"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Render config
        run: node scripts/fleet.ts render "$ID"
      # Only the secrets set in the environment; `--secrets-file` adds to a Worker's secrets and
      # never removes one, so a secret set by hand survives.
      - name: Collect secrets
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SHOPIFY_WEBHOOK_SECRET: ${{ secrets.SHOPIFY_WEBHOOK_SECRET }}
          INTAKE_ALLOWLIST: ${{ secrets.INTAKE_ALLOWLIST }}
        run: |
          node scripts/fleet.ts secrets engine "$RUNNER_TEMP/engine-secrets.json"
          node scripts/fleet.ts secrets web "$RUNNER_TEMP/web-secrets.json"
      # The restore point for this deploy: a migration can't be rolled back, but D1 Time Travel
      # can restore the database to this bookmark (docs/deploy.md, "Restoring D1").
      - name: Record D1 bookmark
        run: |
          # shellcheck disable=SC2016 # the inner shell expands $CONFIG and $RUNNER_TEMP
          retry bash -c 'pnpm --filter @orderloop/web exec wrangler d1 time-travel info DB --json --config "$CONFIG" > "$RUNNER_TEMP/d1-bookmark.json"'
          bookmark=$(jq -er .bookmark "$RUNNER_TEMP/d1-bookmark.json")
          echo "D1 bookmark for $ID before ${GITHUB_SHA::7}: \`$bookmark\`" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::D1 bookmark for $ID before this deploy: $bookmark"
      # Migrations run before the new code, and old code runs against the new schema until the
      # Workers below are live: a migration must be additive (expand), and a destructive one
      # (contract) ships in a later change, once no deployed code needs what it removes.
      - name: Migrate D1
        run: retry pnpm --filter @orderloop/web exec wrangler d1 migrations apply DB --remote --config "$CONFIG"
      # A demo carries the demo data (INSERT OR IGNORE: loading it again changes nothing).
      - name: Load demo data
        if: fromJSON(inputs.deployment).demo
        run: retry pnpm --filter @orderloop/web exec wrangler d1 execute DB --remote --config "$CONFIG" --file ../../packages/db/seed/0001_demo.sql
      # The web Worker binds to the engine, so the engine goes first.
      - name: Deploy engine
        id: engine
        run: |
          secrets=()
          [ "$(cat "$RUNNER_TEMP/engine-secrets.json")" != "{}" ] && secrets=(--secrets-file "$RUNNER_TEMP/engine-secrets.json")
          retry pnpm --filter @orderloop/engine exec wrangler deploy --config "$CONFIG" "${secrets[@]}"
      - name: Build web
        run: ORDERLOOP_WRANGLER_CONFIG="$CONFIG" pnpm --filter @orderloop/web build
      # `wrangler deploy` picks up the build's own config (.wrangler/deploy), made from $CONFIG.
      - name: Deploy web
        id: web
        run: |
          secrets=()
          [ "$(cat "$RUNNER_TEMP/web-secrets.json")" != "{}" ] && secrets=(--secrets-file "$RUNNER_TEMP/web-secrets.json")
          retry pnpm --filter @orderloop/web exec wrangler deploy "${secrets[@]}"
      # A new domain's certificate can take a few minutes to issue, so each check retries for up
      # to five minutes before it counts as failed.
      - name: Smoke test
        id: smoke
        run: |
          curl -fsS --retry 30 --retry-all-errors --retry-delay 10 --retry-max-time 300 "https://$DOMAIN/health"
          # D1, R2 and the engine (over the service binding) all answer.
          curl -fsS --retry 30 --retry-all-errors --retry-delay 10 --retry-max-time 300 "https://$DOMAIN/health/deep"
          # The app itself, not just the health route: the sign-in page renders.
          curl -fsS --retry 30 --retry-all-errors --retry-delay 10 --retry-max-time 300 -o /dev/null "https://$DOMAIN/login"
      # Any failure once the engine has shipped puts each Worker that deployed back on its
      # previous version, so the deployment never runs a new engine behind an old web app (or the
      # reverse). D1 migrations are not rolled back, which is why they must be additive.
      - name: Roll back on a failed deploy
        if: failure() && steps.engine.outcome == 'success'
        run: |
          msg="Deploy failed for ${GITHUB_SHA::7}"
          if [ "${{ steps.web.outcome }}" = "success" ]; then
            retry pnpm --filter @orderloop/web exec wrangler rollback -y -m "$msg" --config "$CONFIG"
          fi
          retry pnpm --filter @orderloop/engine exec wrangler rollback -y -m "$msg" --config "$CONFIG"
      # Static docs Worker; independent of the app, so it goes last and can't block a deploy above.
      - name: Deploy docs
        if: fromJSON(inputs.deployment).docs
        run: retry pnpm docs:deploy
