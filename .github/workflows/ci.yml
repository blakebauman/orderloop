name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request supersedes its last run; a push to main never cancels one that
# is already on its way to production.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The default GITHUB_TOKEN only needs to read the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every check runs even when an earlier one fails, so a red build reports all of its
      # problems in one go.
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Type-check
        if: ${{ !cancelled() }}
        run: pnpm check-types

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build

      # Includes the engine's end-to-end Workflow runs in workerd (Durable Objects, Workflows,
      # D1, R2) with AI_MODE=mock — no network or Cloudflare account needed.
      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test

      # The registry in deployments/ and the configs rendered from it.
      - name: Test fleet
        if: ${{ !cancelled() }}
        run: pnpm test:fleet

      # The Claude Code toolkit in .claude/: its skills, agents and hook wiring, and what the
      # hooks allow, ask about and deny.
      - name: Test toolkit
        if: ${{ !cancelled() }}
        run: pnpm test:toolkit

      # Known high or critical advisories in anything that ships (dev tooling excluded).
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: pnpm audit --prod --audit-level high

  # The web app in WebKit as an iPhone and an iPad, both ways up, and a desktop: layout, safe
  # areas, touch targets and the on-screen keyboard (apps/web/e2e). The dev server runs offline
  # (mock AI, no remote bindings, its own seeded database), so no Cloudflare account is needed.
  devices:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install WebKit
        run: pnpm --filter @orderloop/web exec playwright install --with-deps webkit
      - name: Device tests
        run: pnpm --filter @orderloop/web e2e
      # A failure's traces (DOM, network, console at each step): open with `playwright show-trace`.
      - name: Keep the failures' traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-test-traces
          path: apps/web/test-results/
          retention-days: 7

  # The fleet: every deployment in deployments/, grouped by ring. Each ring waits for the one
  # before it to finish cleanly; an empty ring is skipped. See docs/operations.md. A ring after
  # staging runs past a skipped one (`!failure()`), so it also needs plan to have run: on a pull
  # request plan is skipped, its outputs are empty, and the ring's matrix couldn't be built.
  plan:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      staging: ${{ steps.rings.outputs.staging }}
      internal: ${{ steps.rings.outputs.internal }}
      canary: ${{ steps.rings.outputs.canary }}
      general: ${{ steps.rings.outputs.general }}
      deployments: ${{ steps.rings.outputs.deployments }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: rings
        run: |
          rings=$(node scripts/fleet.ts matrix)
          # Each ring is a list of ids (so its jobs are named by id); `deployments` maps an id to
          # its entry.
          for ring in staging internal canary general; do
            echo "$ring=$(jq -c --arg r "$ring" '[.[$r][].id]' <<<"$rings")" >> "$GITHUB_OUTPUT"
          done
          echo "deployments=$(jq -c '[.[][]] | map({key: .id, value: .}) | from_entries' <<<"$rings")" >> "$GITHUB_OUTPUT"

  staging:
    needs: plan
    if: needs.plan.outputs.staging != '[]'
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.staging) }}
    name: staging
    uses: ./.github/workflows/deploy.yml
    with:
      deployment: ${{ toJSON(fromJSON(needs.plan.outputs.deployments)[matrix.id]) }}
    secrets: inherit

  internal:
    needs: [plan, staging]
    if: ${{ !failure() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.internal != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.internal) }}
    name: internal
    uses: ./.github/workflows/deploy.yml
    with:
      deployment: ${{ toJSON(fromJSON(needs.plan.outputs.deployments)[matrix.id]) }}
    secrets: inherit

  canary:
    needs: [plan, internal]
    if: ${{ !failure() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.canary != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.canary) }}
    name: canary
    uses: ./.github/workflows/deploy.yml
    with:
      deployment: ${{ toJSON(fromJSON(needs.plan.outputs.deployments)[matrix.id]) }}
    secrets: inherit

  general:
    needs: [plan, canary]
    if: ${{ !failure() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.general != '[]' }}
    strategy:
      fail-fast: false
      # Customers in the general ring deploy a few at a time.
      max-parallel: 4
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.general) }}
    name: general
    uses: ./.github/workflows/deploy.yml
    with:
      deployment: ${{ toJSON(fromJSON(needs.plan.outputs.deployments)[matrix.id]) }}
    secrets: inherit
