name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request supersedes its last run; a push to main never cancels one that
# is already on its way to production.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The default GITHUB_TOKEN only needs to read the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every check runs even when an earlier one fails, so a red build reports all of its
      # problems in one go.
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Type-check
        if: ${{ !cancelled() }}
        run: pnpm check-types

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build

      # Includes the engine's end-to-end Workflow runs in workerd (Durable Objects, Workflows,
      # D1, R2) with AI_MODE=mock — no network or Cloudflare account needed.
      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test

      # The registry in deployments/ and the configs rendered from it.
      - name: Test fleet
        if: ${{ !cancelled() }}
        run: pnpm test:fleet

      # Known high or critical advisories in anything that ships (dev tooling excluded).
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: pnpm audit --prod --audit-level high

  # The fleet: every deployment in deployments/, grouped by ring. Each ring waits for the one
  # before it to finish cleanly; an empty ring is skipped. See docs/operations.md.
  plan:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      staging: ${{ steps.rings.outputs.staging }}
      internal: ${{ steps.rings.outputs.internal }}
      canary: ${{ steps.rings.outputs.canary }}
      general: ${{ steps.rings.outputs.general }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: rings
        run: |
          rings=$(node scripts/fleet.ts matrix)
          for ring in staging internal canary general; do
            echo "$ring=$(jq -c --arg r "$ring" '.[$r]' <<<"$rings")" >> "$GITHUB_OUTPUT"
          done

  staging:
    needs: plan
    if: needs.plan.outputs.staging != '[]'
    strategy:
      fail-fast: false
      matrix:
        deployment: ${{ fromJSON(needs.plan.outputs.staging) }}
    uses: ./.github/workflows/deploy.yml
    with:
      deployment: ${{ toJSON(matrix.deployment) }}
    secrets: inherit

  internal:
    needs: [plan, staging]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.internal != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        deployment: ${{ fromJSON(needs.plan.outputs.internal) }}
    uses: ./.github/workflows/deploy.yml
    with:
      deployment: ${{ toJSON(matrix.deployment) }}
    secrets: inherit

  canary:
    needs: [plan, internal]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.canary != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        deployment: ${{ fromJSON(needs.plan.outputs.canary) }}
    uses: ./.github/workflows/deploy.yml
    with:
      deployment: ${{ toJSON(matrix.deployment) }}
    secrets: inherit

  general:
    needs: [plan, canary]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.general != '[]' }}
    strategy:
      fail-fast: false
      # Customers in the general ring deploy a few at a time.
      max-parallel: 4
      matrix:
        deployment: ${{ fromJSON(needs.plan.outputs.general) }}
    uses: ./.github/workflows/deploy.yml
    with:
      deployment: ${{ toJSON(matrix.deployment) }}
    secrets: inherit
