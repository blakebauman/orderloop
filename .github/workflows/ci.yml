name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every check runs even when an earlier one fails, so a red build reports all of its
      # problems in one go.
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Type-check
        if: ${{ !cancelled() }}
        run: pnpm check-types

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build

      # Includes the engine's end-to-end Workflow runs in workerd (Durable Objects, Workflows,
      # D1, R2) with AI_MODE=mock — no network or Cloudflare account needed.
      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test

  deploy:
    # Ships main to orderloop.io once the repository has CLOUDFLARE_API_TOKEN and
    # CLOUDFLARE_ACCOUNT_ID secrets; without them the steps are skipped.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    # The Cloudflare API sometimes fails a request outright (codes 7403, 10013) and succeeds on
    # the next try. Each step below is idempotent, so `retry` runs it up to three times; without
    # it a blip between the engine and web steps leaves production running mismatched Workers.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: pnpm/action-setup@v6
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - name: Install retry helper
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/retry" <<'SH'
          #!/usr/bin/env bash
          for attempt in 1 2 3; do
            "$@" && exit 0
            echo "::warning::attempt $attempt failed: $*"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          exit 1
          SH
          chmod +x "$HOME/.local/bin/retry"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Migrate D1
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: retry pnpm --filter @orderloop/web db:migrate:remote
      # The web Worker binds to the engine, so the engine goes first.
      - name: Deploy engine
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: retry pnpm --filter @orderloop/engine run deploy
      - name: Deploy web
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: retry pnpm --filter @orderloop/web run deploy
      - name: Smoke test
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: curl -fsS --retry 5 --retry-all-errors --retry-delay 5 https://orderloop.io/health
      # Static docs Worker; independent of the app, so it goes last and can't block a deploy above.
      - name: Deploy docs
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: retry pnpm docs:deploy
