name: AI evals

# The golden set (apps/engine/evals) against the live models: weekly, by hand from the Actions tab,
# and on any pull request that changes a prompt, the untrusted-text rules, the redaction or a model
# (wrangler.jsonc vars). Never a required check: a model is not deterministic, so a failure is a
# reason to look, not a broken build. The run summary has a table of every case.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - apps/engine/src/ai.ts
      - apps/engine/wrangler.jsonc
      - apps/engine/evals/**
      - packages/core/src/redact.ts
      - packages/core/src/untrusted.ts
      - packages/core/src/provenance.ts

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CLOUDFLARE_AI_TOKEN: a token with only Workers AI (Read), kept apart from the deploy token.
      - name: Run the evals against the live models
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @orderloop/engine evals
