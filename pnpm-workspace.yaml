packages:
  - 'packages/*'
  - 'apps/*'
  - 'plugins/*'

# Single source of truth for every dependency used by more than one workspace
# package. Bump the version here and it moves everywhere at once.
# A dependency used by exactly one package keeps its version in that package.json.
catalog:
  # React
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0

  # shadcn/ui primitives (shared by packages/ui and apps/web)
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^1.58.0
  radix-ui: ^1.6.0
  tailwind-merge: ^3.0.2

  # Styling — Tailwind v4 is CSS-first; keep the plugin and core in lockstep
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3

  # Data and validation
  drizzle-orm: ^0.45.4
  zod: ^4.6.7
  json-logic-js: ^2.0.5

  # Agents
  agents: ^0.28.1
  '@cloudflare/ai-chat': 0.12.1
  ai: 7.0.139
  '@ai-sdk/react': 4.0.142
  '@ai-sdk/provider': 4.0.27
  workers-ai-provider: 4.0.0
  streamdown: 2.7.0

  # Build toolchain
  typescript: ^6.0.3
  vitest: 5.0.3
  vite: ^8.0.12

  # Cloudflare
  wrangler: ^4.149.0
  '@cloudflare/workers-types': ^5.20261009.1
  '@cloudflare/vitest-plugin': ^1.4.0

overrides:
  # GHSA: quadratic selector parsing (< 7.1.6). Starlight → expressive-code → postcss-nested@6
  # still asks for ^6, which has no patched release. Drop once postcss-nested moves to ^7.
  'postcss-nested>postcss-selector-parser': ^7.1.6
  # GHSA-27r3-jxmh-p828: DoS via trailing bytes after a compressed body (< 2.4.0). express@5.3.0
  # (via @a2a-js/sdk and the MCP SDK) allows ^2.3.0. Drop once express requires ^2.4.0.
  'express>body-parser': ^2.4.0
  # GHSA-xjj6-f33q-929c: DoS via an unhandled error on excessive content-encodings (undici < 7.30.1
  # and 8.0.0–8.12.1). The AI SDK allows ^7.29.0 and Astro's unifont ^8.0.0; drop these once they
  # require the patched releases.
  '@ai-sdk/provider-utils>undici': ^7.30.1
  'unifont>undici': ^8.12.2
